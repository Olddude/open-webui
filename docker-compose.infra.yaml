services:
  mongodb:
    image: mongo:7.0
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-password}
      - MONGO_INITDB_DATABASE=${MONGODB_DATABASE:-open-webui}
    ports:
      - '27017:27017'
    volumes:
      - ./data/mongodb:/data/db
      - ./config/mongodb/mongod.conf:/etc/mongo/mongod.conf:ro
      - ./config/mongodb/init:/docker-entrypoint-initdb.d:ro
    command: ['mongod', '--config', '/etc/mongo/mongod.conf']
    networks:
      - local-bridge-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
    ports:
      - '5432:5432'
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./config/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    networks:
      - local-bridge-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-postgres}']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  redis:
    image: redis:7-alpine
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-password}
    ports:
      - '6379:6379'
    volumes:
      - ./data/redis:/data
    command: redis-server --requirepass ${REDIS_PASSWORD:-password}
    networks:
      - local-bridge-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:latest
    environment:
      - QDRANT__LOG_LEVEL=${QDRANT_LOG_LEVEL:-INFO}
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-}
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - ./data/qdrant:/qdrant/storage
      - ./config/qdrant/config.yaml:/qdrant/config/production.yaml:ro
    command: ['./qdrant', '--config-path', '/qdrant/config/production.yaml']
    networks:
      - local-bridge-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:6333/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-password}
      - LITELLM_SECRET_KEY=${LITELLM_SECRET_KEY:-password}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password}@postgres:5432/litellm
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-password}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - LITELLM_LOG_LEVEL=${LITELLM_LOG_LEVEL:-INFO}
      - LITELLM_TELEMETRY=${LITELLM_TELEMETRY:-false}
    ports:
      - '4000:4000'
    volumes:
      - ./config/litellm/litellm_config.yaml:/app/config.yaml:ro
      - ./data/litellm:/app/data
    command: ['--config', '/app/config.yaml', '--port', '4000']
    networks:
      - local-bridge-network
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  mongo-express:
    image: mongo-express:latest
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGO_ROOT_USERNAME:-admin}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_ROOT_PASSWORD:-password}
      - ME_CONFIG_BASICAUTH_USERNAME=${MONGO_EXPRESS_USERNAME:-admin}
      - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_EXPRESS_PASSWORD:-password}
    ports:
      - '8081:8081'
    networks:
      - local-bridge-network
    depends_on:
      - mongodb
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@example.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-password}
      - PGADMIN_CONFIG_SERVER_MODE=False
    ports:
      - '8082:80'
    volumes:
      - ./data/pgadmin:/var/lib/pgadmin
    networks:
      - local-bridge-network
    depends_on:
      - postgres
    restart: unless-stopped

  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD:-password}
      - HTTP_USER=${REDIS_COMMANDER_USER:-admin}
      - HTTP_PASSWORD=${REDIS_COMMANDER_PASSWORD:-password}
    ports:
      - '8083:8081'
    networks:
      - local-bridge-network
    depends_on:
      - redis
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.1
    environment:
      - KC_DB=postgres
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KC_BOOTSTRAP_ADMIN_PASSWORD:-password}
      - KC_DB_URL=jdbc:postgresql://postgres:5432/${KEYCLOAK_DB:-keycloak}
      - KC_DB_USERNAME=${POSTGRES_USER:-admin}
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD:-password}
    ports:
      - '8084:8080'
    command: [start-dev]
    networks:
      - local-bridge-network
    depends_on:
      - postgres
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/health/ready']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  local-bridge-network:
    driver: bridge
    name: local-bridge-network

volumes:
  mongodb-data:
  postgres-data:
  redis-data:
  qdrant-data:
  litellm-data:
  pgadmin-data:
